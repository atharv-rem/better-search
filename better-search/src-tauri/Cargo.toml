[package]
name = "better-search"
version = "0.6.1"
description = "Fast file search for Windows"
authors = ["Atharv Remeshan"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "better_search_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already pulled in by Tauri; "time" for the delayed memory trim on hide,
# "sync" for handing the backend's replies to the requests waiting on them.
tokio = { version = "1", features = ["time", "sync"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
# Web search through the user's own API keys; already pulled in by the updater.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider"] }
# ring for reqwest's TLS, as the updater does, rather than building aws-lc.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Shell icons, previews and web results' favicons as data URLs.
base64 = "0.23"
# Reads .docx files (zips) for their preview; already pulled in by the updater.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# The "=" calculator in the search box.
fend-core = "1.5.9"


# Unoptimized, encoding a preview thumbnail takes several times longer, which
# makes the preview lag behind the arrow keys in `tauri dev`.
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.jpeg-encoder]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
# Same versions Tauri's WebView2 backend (wry) uses, for the memory target level.
webview2-com = "0.39"
windows-core = "0.62"
# Private working set for the memory readout.
windows = { version = "0.62", features = [
    # First-page previews of PDFs, which Windows has no thumbnails for, drawn
    # on Direct3D's software rasterizer (pdf_first_page).
    "Data_Pdf",
    "Win32_System_WinRT_Pdf",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Foundation",
    # Reading the text in images for content search (images.rs): the OCR
    # engine, the decoder that hands it pixels, and the list of lines it reads.
    "Foundation_Collections",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
    # Search providers' API keys, kept in Credential Manager.
    "Win32_Security_Credentials",
    "Win32_System_Com",
    # Sidecars end with the app, even when it's killed (tie_to_app).
    "Win32_System_JobObjects",
    # The app's own processes, for the memory readout and the trim on hide.
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    # Snap mode: hides cloaked windows, and measures their invisible borders.
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Encodes shell icons; already pulled in by Tauri.
png = "0.18"
winreg = "0.56"
# Encodes preview thumbnails of photos, a fraction of their size as PNG.
jpeg-encoder = "0.7.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
