# Checks that the Go programs, the interface and the Rust app all still build,
# so a broken change shows up on its pull request instead of in a release.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: better-search/package-lock.json

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: better-search/backend/go.mod
          cache-dependency-path: better-search/backend/go.sum

      # The runner image comes with rustup; bring its stable Rust up to date.
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: better-search/src-tauri -> target

      # unsafeptr off: cache.go reads libc heap memory, which vet can't tell apart.
      - name: Vet Go programs
        working-directory: better-search/backend
        run: go vet -unsafeptr=false ./...

      - name: Build Go programs
        shell: pwsh
        run: ./better-search/backend/scripts/build-backend.ps1

      - name: Install npm packages
        working-directory: better-search
        run: npm ci

      - name: Build interface
        working-directory: better-search
        run: npm run build

      - name: Check Rust app
        working-directory: better-search/src-tauri
        run: cargo check --locked
