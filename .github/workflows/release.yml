# On every push to main, release-please keeps a "release PR" up to date with
# the next version number and changelog (worked out from the commit messages).
# Merging that PR tags the release, and the build job then builds the installer
# and attaches it, plus latest.json for the in-app updater, to the release.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: better-search/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: better-search/backend/go.mod
          cache-dependency-path: better-search/backend/go.sum

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: better-search/src-tauri -> target

      - name: Install npm packages
        working-directory: better-search
        run: npm ci

      # The Go helper, watcher and indexer that Tauri bundles beside the app.
      - name: Build Go programs
        shell: pwsh
        run: ./better-search/backend/scripts/build-backend.ps1

      - name: Build installer and upload to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files so installed copies trust them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: better-search
          tagName: ${{ needs.release-please.outputs.tag_name }}
          includeUpdaterJson: true
